<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insight to Impact Conversion Workbook | Phoszade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f172a;
  --ink-muted: #475569;
  --ink-light: #94a3b8;
  --bg: #f6f8f6;
  --card-bg: #ffffff;
  --border: #0f172a;
  --border-subtle: #cbd5cb;
  
  /* Neobrutalist Stage Accents */
  --c-soil: #b45309;
  --c-soil-bg: #fef3c7;
  
  --c-seed: #a16207;
  --c-seed-bg: #fef9c3;
  
  --c-root: #15803d;
  --c-root-bg: #dcfce7;
  
  --c-stem: #0f766e;
  --c-stem-bg: #ccfbf1;
  
  --c-branch: #c2410c;
  --c-branch-bg: #ffedd5;
  
  --c-fruit: #be123c;
  --c-fruit-bg: #ffe4e6;
  
  --c-sap: #7e22ce;
  --c-sap-bg: #f3e8ff;
  
  --c-yellow: #fde047;
  --c-green: #22c55e;
  
  --shadow-sm: 2px 2px 0px var(--border);
  --shadow-md: 4px 4px 0px var(--border);
  --shadow-lg: 6px 6px 0px var(--border);
  
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html {
  scroll-behavior: smooth;
  scroll-padding-top: 110px;
  background-color: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  background-color: var(--bg);
  background-image: 
    radial-gradient(#cbd5cb 1.4px, transparent 1.4px),
    radial-gradient(#cbd5cb 1.4px, #f6f8f6 1.4px);
  background-size: 32px 32px;
  background-position: 0 0, 16px 16px;
  color: var(--ink);
  line-height: 1.6;
}

/* ========================================================
   TOP NAVIGATION (HAVEN STYLE WITH SPACIOUS PADDING)
   ======================================================== */
.haven-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 2px solid var(--border);
}

.haven-header-inner {
  max-width: 1440px;
  width: calc(100% - 48px);
  margin: 0 auto;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  text-decoration: none;
  flex-shrink: 0;
}

.brand-logo-img {
  height: 32px;
  width: auto;
  display: block;
  object-fit: contain;
}

.brand-title-divider {
  height: 24px;
  width: 2px;
  background: #0d4a30;
}

.brand-title-text {
  font-size: 1.05rem;
  font-weight: 900;
  letter-spacing: -0.3px;
  color: #0d4a30;
}

/* Center Navigation Group */
.nav-center-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-link-btn {
  background: transparent;
  border: 1.5px solid transparent;
  color: var(--ink-muted);
  font-size: 0.92rem;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.nav-link-btn:hover {
  background: #f8fafc;
  color: var(--ink);
  border-color: var(--border);
}

.nav-link-btn.active {
  background: var(--c-yellow);
  color: var(--ink);
  border: 1.5px solid var(--border);
  box-shadow: 2px 2px 0px var(--border);
}

/* Milestones Dropdown */
.nav-dropdown-wrap {
  position: relative;
}

.chevron-icon {
  width: 14px;
  height: 14px;
  transition: transform 0.2s ease;
}

.nav-dropdown-wrap.open .chevron-icon {
  transform: rotate(180deg);
}

.milestones-dropdown-menu {
  position: absolute;
  top: calc(100% + 12px);
  left: 0;
  background: #ffffff;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  width: 260px;
  padding: 8px;
  display: none;
  z-index: 150;
  animation: fadeIn 0.15s ease-out;
}

.nav-dropdown-wrap.open .milestones-dropdown-menu {
  display: block;
}

.dropdown-item {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.15s ease;
}

.dropdown-item:hover {
  background: #f8fafc;
  border-color: var(--border);
  transform: translateX(2px);
}

.dropdown-item.active-item {
  background: #ecfdf5;
  border-color: #059669;
  font-weight: 800;
}

.dropdown-stage-num {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}

.dropdown-item-meta {
  display: flex;
  flex-direction: column;
}

.dropdown-item-name {
  font-size: 0.94rem;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.2;
}

.dropdown-item-sub {
  font-size: 0.72rem;
  color: var(--ink-muted);
}

/* Header Right Status */
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.save-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #ffffff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-full);
  padding: 6px 14px;
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--ink);
  box-shadow: 1.5px 1.5px 0px var(--border);
}

.save-dot {
  width: 7px;
  height: 7px;
  background: var(--c-green);
  border-radius: 50%;
}

/* Linear Progress Bar */
.progress-strip {
  height: 3px;
  background: #cbd5e1;
  width: 100%;
}
.progress-bar-fill {
  height: 100%;
  background: #0d4a30;
  width: 0%;
  transition: width 0.3s ease;
}

/* ========================================================
   A4 LANDSCAPE WORKSPACE BOARD SHEET
   ======================================================== */
.workspace-board {
  max-width: 1440px;
  width: calc(100% - 48px);
  margin: 28px auto 70px;
}

/* A4 Landscape Ratio: 297mm / 210mm = ~1.414 */
.a4-landscape-sheet {
  max-width: 1240px;
  width: 100%;
  min-height: 876px; /* Proportional A4 landscape height */
  margin: 0 auto;
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  padding: 44px 52px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  animation: fadeIn 0.25s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Neobrutalist Buttons */
.neo-btn {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 800;
  padding: 13px 26px;
  border-radius: var(--radius-md);
  border: 2px solid var(--border);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  box-shadow: 3px 3px 0px var(--border);
  transition: all 0.15s ease;
}

.neo-btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0px var(--border);
}

.neo-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0px var(--border);
}

.btn-yellow {
  background: var(--c-yellow);
  color: var(--ink);
}

.btn-white {
  background: #ffffff;
  color: var(--ink);
}

.btn-black {
  background: var(--ink);
  color: #ffffff;
}

/* ========================================================
   SCREEN -3: INTRO (ALL-GREEN A4 LANDSCAPE HERO)
   ======================================================== */
.splash-green-card {
  background: radial-gradient(circle at 50% 15%, #0d4a30 0%, #06301f 100%);
  border: 2.5px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  color: #ffffff;
  padding: 80px 60px;
  text-align: center;
  justify-content: center;
}

.splash-pill {
  display: inline-block;
  background: rgba(255, 255, 255, 0.08);
  border: 1.5px solid rgba(253, 224, 71, 0.7);
  color: var(--c-yellow);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 6px 20px;
  border-radius: var(--radius-full);
}

.splash-title {
  font-size: 3.8rem;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -1.5px;
  color: #ffffff;
  max-width: 860px;
  margin: 0 auto 24px;
}

.splash-title span {
  color: var(--c-yellow);
}

.splash-desc {
  font-size: 1.3rem;
  color: #d1fae5;
  line-height: 1.75;
  max-width: 780px;
  margin: 0 auto 44px;
  font-weight: 400;
}

.splash-cta-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

/* ========================================================
   SCREEN -2: QUOTE CARD (A4 LANDSCAPE)
   ======================================================== */
.quote-sheet {
  text-align: center;
  padding: 48px 60px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.quote-center-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  width: 100%;
  margin: auto 0;
  padding: 20px 0;
}

.quote-pretitle {
  display: inline-block;
  background: #f1f5f9;
  border: 1.5px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ink);
  padding: 6px 18px;
  border-radius: var(--radius-full);
  margin-bottom: 28px;
}

.quote-statement {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 2.8rem;
  font-weight: 700;
  line-height: 1.45;
  color: var(--ink);
  max-width: 900px;
  margin: 0 auto 40px;
}

.quote-author-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--c-yellow);
  border: 2px solid var(--border);
  padding: 10px 28px;
  border-radius: var(--radius-full);
  font-size: 1.15rem;
  font-weight: 800;
  box-shadow: 2.5px 2.5px 0px var(--border);
}

/* ========================================================
   SCREEN -1: GUIDE (A4 LANDSCAPE)
   ======================================================== */
.guide-sheet {
  padding: 56px 56px;
}

.guide-pill {
  display: inline-block;
  background: #f1f5f9;
  border: 1.5px solid var(--border);
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 6px 16px;
  border-radius: var(--radius-full);
  margin-bottom: 16px;
}

.guide-heading {
  font-size: 2.6rem;
  font-weight: 900;
  letter-spacing: -0.5px;
  margin-bottom: 24px;
}

.guide-prose {
  background: #f8fafc;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  padding: 32px 36px;
  box-shadow: 3px 3px 0px var(--border);
  font-size: 1.2rem;
  line-height: 1.85;
  color: var(--ink);
  margin-bottom: 32px;
}

.guide-ready-wrap {
  text-align: center;
  padding: 24px 0;
  border-top: 2px dashed var(--border-subtle);
  border-bottom: 2px dashed var(--border-subtle);
  margin-bottom: 32px;
}

.guide-ready-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.2rem;
  font-weight: 900;
  letter-spacing: 5px;
  color: var(--ink);
}

/* ========================================================
   SCREEN 0: TREE MAP (A4 LANDSCAPE TWO-COLUMN BOARD)
   ======================================================== */
.tree-sheet {
  padding: 44px 52px;
}

.tree-map-split {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 40px;
  align-items: center;
  margin: 16px 0 28px;
}

.tree-illustration-box {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
}

svg.vision-tree-svg {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 6px 12px rgba(15,23,42,0.08));
}

.tree-interactive-group {
  cursor: pointer;
  transition: transform 0.15s ease;
}

.tree-interactive-group:hover {
  transform: scale(1.02);
}

.tree-nodes-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tree-node-row {
  background: #ffffff;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  cursor: pointer;
  box-shadow: 2px 2px 0px var(--border);
  transition: all 0.15s ease;
}

.tree-node-row:hover {
  transform: translate(-2px, -2px);
  box-shadow: 4px 4px 0px var(--border);
  border-color: var(--stage-color);
  background: var(--stage-bg);
}

.tree-node-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.tree-node-index {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--stage-bg);
  color: var(--stage-color);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 800;
  font-size: 0.85rem;
}

.tree-node-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--ink);
}

.tree-node-desc {
  font-size: 0.82rem;
  color: var(--ink-muted);
}

.tree-node-status {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--ink);
  background: #f8fafc;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-full);
  padding: 4px 12px;
}

/* ========================================================
   WORKBOOK MILESTONE PAGES (A4 LANDSCAPE SIZING & SUB-PAGE FLOW)
   ======================================================== */
.sheet-header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.stage-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--stage-bg);
  border: 2px solid var(--border);
  color: var(--stage-color);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  font-weight: 800;
  padding: 5px 14px;
  border-radius: var(--radius-full);
  box-shadow: 2px 2px 0px var(--border);
}

.sheet-page-indicator {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--ink-muted);
  background: #f1f5f9;
  border: 1.5px solid var(--border);
  padding: 4px 12px;
  border-radius: var(--radius-full);
}

.stage-name-title {
  font-size: 2.6rem;
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1.1;
  margin-bottom: 4px;
}

.stage-focus-sub {
  font-size: 1.15rem;
  color: var(--ink-muted);
  font-weight: 600;
  margin-bottom: 20px;
}

/* Milestone Definition Box (Stays on EVERY page as instructed!) */
.milestone-definition-card {
  background: var(--stage-bg);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  box-shadow: 3px 3px 0px var(--border);
  margin-bottom: 20px;
}

.milestone-def-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--stage-color);
  margin-bottom: 4px;
}

.milestone-def-body {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.5;
}

.milestone-rule-card {
  margin-top: 10px;
  padding: 10px 14px;
  background: #ffffff;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.92rem;
  font-weight: 800;
  color: var(--c-fruit);
  box-shadow: 2px 2px 0px var(--border);
  line-height: 1.45;
}

.sheet-content-wrap {
  display: flex;
  flex-direction: column;
  flex: 1;
}

/* Subpage Questions Grid (Clean 2 by 2 Column Arrangement - Expands to fill available sheet height) */
.subpage-questions-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-auto-rows: 1fr;
  gap: 20px;
  flex: 1;
  margin-bottom: 20px;
}

.prompt-card {
  background: #ffffff;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  box-shadow: 2.5px 2.5px 0px var(--border);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  height: 100%;
  box-sizing: border-box;
}

/* 2x2 Layout: Span 2 columns when a card is standalone or the balanced 3rd card */
.subpage-questions-grid > .prompt-card:only-child,
.subpage-questions-grid > .prompt-card:nth-child(3):last-child,
.subpage-questions-grid > .prompt-card.span-2 {
  grid-column: span 2;
}

.subpage-questions-grid > .prompt-card:only-child .clean-textarea,
.subpage-questions-grid > .prompt-card.span-2 .clean-textarea {
  min-height: 180px;
}

.prompt-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 0.98rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.45;
  margin-bottom: 12px;
}

.prompt-number {
  font-family: 'JetBrains Mono', monospace;
  background: var(--stage-bg);
  color: var(--stage-color);
  border: 1.5px solid var(--border);
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 800;
  flex-shrink: 0;
  margin-top: 1px;
}

.clean-textarea, .clean-input {
  width: 100%;
  border: 1.5px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.98rem;
  color: var(--ink);
  background: #fafbfc;
  transition: all 0.15s ease;
  line-height: 1.55;
  box-sizing: border-box;
}

.clean-textarea {
  flex: 1;
  min-height: 110px;
  resize: vertical;
}

.clean-textarea:focus, .clean-input:focus {
  outline: none;
  border-color: var(--border);
  background: #ffffff;
  box-shadow: 2px 2px 0px var(--border);
}

/* Action Step Full Sheet Card */
.action-step-card {
  background: #ffffff;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  padding: 32px 36px;
  box-shadow: 3px 3px 0px var(--border);
  margin-bottom: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.action-step-tag {
  display: inline-block;
  background: var(--c-yellow);
  border: 1.5px solid var(--border);
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  font-weight: 800;
  padding: 4px 14px;
  border-radius: var(--radius-full);
}

.action-step-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--ink);
  margin-bottom: 22px;
  line-height: 1.45;
}

.action-fields-grid {
  display: grid;
  gap: 18px;
  flex: 1;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}

.field-group .clean-textarea {
  flex: 1;
  min-height: 160px;
}

.field-group label {
  font-size: 0.92rem;
  font-weight: 800;
  color: var(--ink);
}

/* Dedicated "Your Thoughts" Full Page */
.journal-canvas-card {
  background: #ffffff;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  padding: 28px 32px;
  box-shadow: 3px 3px 0px var(--border);
  margin-bottom: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* ========================================================
   SUB-PAGE SEGMENTATION LOGIC (2x2 QUESTIONS + ACTION + DEDICATED THOUGHTS)
   ======================================================== */
function getMilestoneSheets(stage) {
  var sheets = [];
  if (stage.id === "soil") { // 9 questions: 2x2 on P1 & P2, P3 reflection, P4 Action, P5 Thoughts
    sheets.push({ type: "q", questions: [0, 1, 2, 3] });
    sheets.push({ type: "q", questions: [4, 5, 6, 7] });
    sheets.push({ type: "q", questions: [8] });
    sheets.push({ type: "act" });
    sheets.push({ type: "thoughts" });
  } else if (stage.id === "seed") { // 8 questions: pure 2x2 on P1 & P2, P3 Action, P4 Thoughts
    sheets.push({ type: "q", questions: [0, 1, 2, 3] });
    sheets.push({ type: "q", questions: [4, 5, 6, 7] });
    sheets.push({ type: "act" });
    sheets.push({ type: "thoughts" });
  } else if (stage.id === "root") { // 6 questions: 2x2 on P1, 2-col on P2, P3 Action, P4 Thoughts
    sheets.push({ type: "q", questions: [0, 1, 2, 3] });
    sheets.push({ type: "q", questions: [4, 5] });
    sheets.push({ type: "act" });
    sheets.push({ type: "thoughts" });
  } else if (stage.id === "stem") { // 11 questions: 2x2 on P1 & P2, 3 questions on P3, P4 Action, P5 Thoughts
    sheets.push({ type: "q", questions: [0, 1, 2, 3] });
    sheets.push({ type: "q", questions: [4, 5, 6, 7] });
    sheets.push({ type: "q", questions: [8, 9, 10] });
    sheets.push({ type: "act" });
    sheets.push({ type: "thoughts" });
  } else if (stage.id === "branch") { // 5 questions: 2x2 on P1, Q5 on P2, P3 Action, P4 Thoughts
    sheets.push({ type: "q", questions: [0, 1, 2, 3] });
    sheets.push({ type: "q", questions: [4] });
    sheets.push({ type: "act" });
    sheets.push({ type: "thoughts" });
  } else if (stage.id === "fruit") { // 5 questions: 2x2 on P1, Q5 on P2, P3 Action, P4 Thoughts
    sheets.push({ type: "q", questions: [0, 1, 2, 3] });
    sheets.push({ type: "q", questions: [4] });
    sheets.push({ type: "act" });
    sheets.push({ type: "thoughts" });
  } else if (stage.id === "sap") { // 5 questions: 2x2 on P1, Q5 on P2, P3 Action, P4 Thoughts
    sheets.push({ type: "q", questions: [0, 1, 2, 3] });
    sheets.push({ type: "q", questions: [4] });
    sheets.push({ type: "act" });
    sheets.push({ type: "thoughts" });
  }
  return sheets;
}

// Screen 1 to 7: Stages Rendered by A4 Landscape Sheets
function renderStage(stageIdx, pageIdx) {
  var s = STAGES[stageIdx];
  var stageNum = stageIdx + 1;
  var sheets = getMilestoneSheets(s);
  var currentSheet = sheets[pageIdx] || sheets[0];
  var totalSheets = sheets.length;

  // Milestone Definition Box (STAYS ON EVERY PAGE AS INSTRUCTED)
  var definitionHTML = "";
  if (s.definition) {
    definitionHTML = `
      <div class="milestone-definition-card">
        <div class="milestone-def-tag">${s.definitionLabel || "Milestone Definition"}</div>
        <div class="milestone-def-body">${s.definition}</div>
        ${s.isSacredRule ? `<div class="milestone-rule-card">⚠️ Rule: If an effort was not converted into a trackable, countable, and measurable result, it does not count as a fruit.</div>` : ''}
      </div>
    `;
  }

  // Middle content: Either Questions or Action & Thoughts
  var bodyHTML = "";

  if (currentSheet.type === "q") {
    var qItems = currentSheet.questions.map(function(qIdx){
      var q = s.questions[qIdx];
      var qKey = "q_" + s.id + "_" + qIdx;
      var currentVal = getVal(qKey);
      return `
        <div class="prompt-card">
          <div class="prompt-label">
            <span class="prompt-number">${qIdx + 1}</span>
            <span>${q}</span>
          </div>
          <textarea class="clean-textarea" 
                    data-k="${qKey}" 
                    placeholder="Record your reflection here..."
                    oninput="setVal('${qKey}', this.value)">${escapeHTML(currentVal)}</textarea>
        </div>
      `;
    }).join('');

    bodyHTML = `
      <div class="subpage-questions-grid">
        ${qItems}
      </div>
    `;
  } else if (currentSheet.type === "act") {
    var fieldsHTML = s.fields.map(function(f){
      var currentVal = getVal(f.key);
      var inputControl = "";
      if (f.type === "textarea") {
        inputControl = `
          <textarea class="clean-textarea" 
                    data-k="${f.key}" 
                    placeholder="${f.placeholder || ''}"
                    oninput="setVal('${f.key}', this.value)">${escapeHTML(currentVal)}</textarea>
        `;
      } else if (f.type === "date") {
        inputControl = `
          <input type="date" class="clean-input" 
                 data-k="${f.key}" 
                 value="${escapeHTML(currentVal)}"
                 onchange="setVal('${f.key}', this.value)">
        `;
      } else {
        inputControl = `
          <input type="text" class="clean-input" 
                 data-k="${f.key}" 
                 placeholder="${f.placeholder || ''}"
                 value="${escapeHTML(currentVal)}"
                 oninput="setVal('${f.key}', this.value)">
        `;
      }

      return `
        <div class="field-group">
          <label>${f.label}</label>
          ${inputControl}
        </div>
      `;
    }).join('');

    bodyHTML = `
      <div class="action-step-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <span class="action-step-tag">${s.actionTitle}</span>
          <span style="font-family:'JetBrains Mono',monospace; font-size:0.75rem; font-weight:800; color:var(--stage-color); background:var(--stage-bg); border:1.5px solid var(--border); padding:3px 12px; border-radius:var(--radius-full);">PRACTICAL COMMITMENT</span>
        </div>
        <div class="action-step-title">${s.actionDesc}</div>
        <div class="action-fields-grid">
          ${fieldsHTML}
        </div>
      </div>
    `;
  } else if (currentSheet.type === "thoughts") {
    var thoughtsKey = "thoughts_" + s.id;
    var thoughtsVal = getVal(thoughtsKey);

    bodyHTML = `
      <div class="journal-canvas-card">
        <div class="journal-canvas-header">
          <div>
            <div class="journal-canvas-title">Your thoughts:</div>
            <div style="font-size:0.92rem; color:var(--ink-muted); margin-top:4px;">Capture your personal reflections, notes, or inspirations for this milestone.</div>
          </div>
          <div class="journal-canvas-badge">PERSONAL JOURNAL</div>
        </div>
        <textarea class="lined-journal-textarea" 
                  data-k="${thoughtsKey}" 
                  placeholder="Record your thoughts, reflections, and personal insights freely here..."
                  oninput="setVal('${thoughtsKey}', this.value)">${escapeHTML(thoughtsVal)}</textarea>
      </div>
    `;
  }

  // Footer Navigation Logic:
  var prevBtnHTML = "";
  if (pageIdx > 0) {
    if (currentSheet.type === "thoughts") {
      prevBtnHTML = `<button class="neo-btn btn-white" onclick="goToStep(${stageNum}, ${pageIdx - 1})">&larr; Back to Action Step</button>`;
    } else {
      prevBtnHTML = `<button class="neo-btn btn-white" onclick="goToStep(${stageNum}, ${pageIdx - 1})">&larr; Previous Page</button>`;
    }
  } else {
    if (stageNum === 1) {
      prevBtnHTML = `<button class="neo-btn btn-white" onclick="goToStep(0)">&larr; Tree Map</button>`;
    } else {
      var prevSheets = getMilestoneSheets(STAGES[stageIdx - 1]);
      prevBtnHTML = `<button class="neo-btn btn-white" onclick="goToStep(${stageNum - 1}, ${prevSheets.length - 1})">&larr; Stage ${stageNum - 1}</button>`;
    }
  }

  var nextBtnHTML = "";
  if (pageIdx < totalSheets - 1) {
    if (currentSheet.type === "act") {
      nextBtnHTML = `<button class="neo-btn btn-black" onclick="goToStep(${stageNum}, ${pageIdx + 1})">Next: Your Thoughts &rarr;</button>`;
    } else {
      nextBtnHTML = `<button class="neo-btn btn-black" onclick="goToStep(${stageNum}, ${pageIdx + 1})">Next Page &rarr;</button>`;
    }
  } else {
    if (stageNum < 7) {
      nextBtnHTML = `<button class="neo-btn btn-yellow" onclick="goToStep(${stageNum + 1}, 0)">Next Milestone: ${STAGES[stageNum].name} &rarr;</button>`;
    } else {
      nextBtnHTML = `<button class="neo-btn btn-yellow" onclick="goToStep(8)">View Summary &rarr;</button>`;
    }
  }

  // Header intro: Show title, subtitle, and definition ONLY on the first page of each milestone
  var headerIntroHTML = "";
  if (pageIdx === 0) {
    headerIntroHTML = `
      <h1 class="stage-name-title">${s.name}</h1>
      <div class="stage-focus-sub">${s.subtitle}</div>
      ${definitionHTML}
    `;
  }

  return `
    <div class="a4-landscape-sheet ${pageIdx > 0 ? 'is-subpage' : ''}" style="--stage-color:${s.color}; --stage-bg:${s.bg};">
      <div class="sheet-content-wrap">
        <div class="sheet-header-top"${pageIdx > 0 ? ' style="margin-bottom: 24px;"' : ''}>
          <div class="stage-pill">
            <span>STAGE ${stageNum} OF 7 &nbsp;·&nbsp; ${s.name.toUpperCase()}</span>
          </div>
          <div class="sheet-page-indicator">PAGE ${pageIdx + 1} OF ${totalSheets}</div>
        </div>

        ${headerIntroHTML}

        <!-- Page Specific Body (Questions, Action Step, or Your Thoughts) -->
        ${bodyHTML}
      </div>

      <!-- Navigation Footer -->
      <div class="sheet-nav-footer">
        ${prevBtnHTML}
        ${nextBtnHTML}
      </div>
    </div>
  `;
}

// Screen 8: Summary Page (Long Flow Format from Before)
function renderSummary() {
  function formatBlock(label, val) {
    if (!val || !String(val).trim()) return "";
    return '<b>' + escapeHTML(label) + ':</b>\n' + escapeHTML(String(val).trim());
  }

  var stagesHTML = STAGES.map(function(s){
    var blocks = [];

    if (s.id === "soil") {
      var sum = getVal("soil_summary");
      if (sum) blocks.push(formatBlock("Current Soil Condition", sum));
      var th = getVal("thoughts_soil");
      if (th) blocks.push(formatBlock("Personal Reflections & Notes", th));
    } else if (s.id === "seed") {
      var sd = getVal("seed_desc");
      if (sd) blocks.push(formatBlock("Seed Planted in this Season", sd));
      var un = getVal("seed_unlearn");
      if (un) blocks.push(formatBlock("Mindsets & Habits to Unlearn", un));
      var th = getVal("thoughts_seed");
      if (th) blocks.push(formatBlock("Personal Reflections & Notes", th));
    } else if (s.id === "root") {
      var f1 = getVal("root_f1"), f2 = getVal("root_f2"), f3 = getVal("root_f3");
      var fList = [f1, f2, f3].filter(function(x){ return x && x.trim(); });
      if (fList.length) {
        blocks.push('<b>Foundations to Strengthen:</b>\n' + fList.map(function(x, idx){ return (idx+1) + ". " + escapeHTML(x.trim()); }).join("\n"));
      }
      var dt = getVal("root_date");
      if (dt) blocks.push(formatBlock("Target Start Date", dt));
      var th = getVal("thoughts_root");
      if (th) blocks.push(formatBlock("Personal Reflections & Notes", th));
    } else if (s.id === "stem") {
      var rt = getVal("stem_routines");
      if (rt) blocks.push(formatBlock("Daily Execution & Routines", rt));
      var acc = getVal("stem_accountability");
      if (acc) blocks.push(formatBlock("Accountability Partner & System", acc));
      var rev = getVal("stem_review");
      if (rev) blocks.push(formatBlock("First System Review Date", rev));
      var th = getVal("thoughts_stem");
      if (th) blocks.push(formatBlock("Personal Reflections & Notes", th));
    } else if (s.id === "branch") {
      var b1 = getVal("branch_1"), b2 = getVal("branch_2"), b3 = getVal("branch_3");
      var bList = [b1 ? "Area 1: " + b1 : "", b2 ? "Area 2: " + b2 : "", b3 ? "Area 3: " + b3 : ""].filter(Boolean);
      if (bList.length) {
        blocks.push('<b>Areas of Practical Expression:</b>\n' + bList.map(function(x){ return escapeHTML(x); }).join("\n\n"));
      }
      var th = getVal("thoughts_branch");
      if (th) blocks.push(formatBlock("Personal Reflections & Notes", th));
    } else if (s.id === "fruit") {
      var fs = getVal("fruit_seen");
      if (fs) blocks.push(formatBlock("Fruits I Am Beginning to See (Trackable, Countable, Measurable)", fs));
      var fe = getVal("fruit_expected");
      if (fe) blocks.push(formatBlock("Fruits I Expect to See Soon (in 90–180 Days)", fe));
      var th = getVal("thoughts_fruit");
      if (th) blocks.push(formatBlock("Personal Reflections & Notes", th));
    } else if (s.id === "sap") {
      var sp = getVal("sap_practices");
      if (sp) blocks.push(formatBlock("My Renewal Practices (Spiritual, Intellectual, Emotional)", sp));
      var sm = getVal("sap_mentors");
      if (sm) blocks.push(formatBlock("Mentors, Coaches & Continuous Sources of Wisdom", sm));
      var sd = getVal("sap_date");
      if (sd) blocks.push(formatBlock("Next Scheduled Renewal Check-in", sd));
      var th = getVal("thoughts_sap");
      if (th) blocks.push(formatBlock("Personal Reflections & Notes", th));
    }

    var contentHTML = "";
    if (blocks.length > 0) {
      contentHTML = `<div class="summary-milestone-answer-box">${blocks.join("\n\n")}</div>`;
    } else {
      contentHTML = `
        <div class="summary-milestone-answer-box summary-empty-note">
          No responses recorded yet for this stage.
          <span style="display:inline-block; margin-left:6px; cursor:pointer; text-decoration:none; font-weight:800; color:var(--ink);" onclick="goToStep(${s.num}, 0)">Jump to ${s.name} &rarr;</span>
        </div>
      `;
    }

    return `
      <div class="summary-milestone-flow-card" style="--flow-color:${s.color}; --flow-bg:${s.bg};">
        <div class="summary-milestone-topbar">
          <div class="summary-stage-chip">
            <span>STAGE ${s.num}</span>
            <span>·</span>
            <span>${s.name.toUpperCase()}</span>
          </div>
          <button class="summary-jump-btn" onclick="goToStep(${s.num}, 0)">
            Edit Stage ${s.num} &rarr;
          </button>
        </div>
        <div class="summary-milestone-name">${s.num}. ${s.name}</div>
        <div class="summary-milestone-subtitle">${s.subtitle}</div>
        ${contentHTML}
      </div>
    `;
  }).join('');

  var comVal = getVal("my_commitment");
  var sigVal = getVal("signer_name");
  var dateVal = getVal("sign_date");

  return `
    <div class="summary-flow-sheet">
      <!-- Header Block -->
      <div class="summary-flow-header">
        <div class="summary-flow-tag">WORKBOOK SYNTHESIS · 7 STAGES</div>
        <h1 class="summary-flow-title">Insight to Impact Summary</h1>
        <p class="summary-flow-desc">
          Review your core reflections, established systems, and measurable commitments across each stage of the Visionary Tree before concluding your session.
        </p>
      </div>

      <!-- Remember Banner -->
      <div class="summary-remember-card">
        <div class="summary-remember-badge">REMEMBER</div>
        <div class="summary-remember-title">Growth is a journey, not an event.</div>
        <p class="summary-remember-text">
          This workbook helps you intentionally move from awareness to transformation, from potential to productivity, and from growth to sustained impact.
          <br>
          Let this visionary tree guide you into deeper clarity, stronger systems, fruitful living, and continuous renewal of your purpose-driven life.
        </p>
      </div>

      <!-- 7 Milestone Breakdown Cards (Long Flow) -->
      <div class="summary-milestones-flow">
        ${stagesHTML}
      </div>

      <!-- Mindset Quiz (Self-Check Section) -->
      <div class="summary-quiz-section">
        <div style="font-family:'JetBrains Mono', monospace; font-size:0.75rem; font-weight:800; color:var(--ink-muted); text-transform:uppercase; margin-bottom:4px; letter-spacing:1px;">Self-Check</div>
        <div class="summary-quiz-title">Mindset Quiz (For The Participant)</div>
        <p class="summary-quiz-sub">Assess your internal mindset and alignment for implementing these insights.</p>
        
        <div class="mindset-checklist">
          ${MINDSET_QUESTIONS.map(function(q, i){
            var qk = "mindset_" + i;
            var checked = STORE[qk] ? "checked" : "";
            return `
              <label class="mindset-check-item">
                <input type="checkbox" ${checked} onchange="setVal('${qk}', this.checked)">
                <span>${q}</span>
              </label>
            `;
          }).join('')}
        </div>
      </div>

      <!-- My Commitment Declaration -->
      <div class="summary-commitment-card">
        <span class="summary-commitment-tag">PLEDGE & CONSECRATION</span>
        <div class="summary-commitment-title">My Personal Commitment</div>
        <p class="summary-commitment-desc">What I am declaring and committing to based on the insights gained from this workbook.</p>

        <div class="field-group" style="margin-bottom:18px;">
          <label>I commit to…</label>
          <textarea class="clean-textarea" style="min-height:90px;"
                    placeholder="Write your personal declaration of commitment..."
                    oninput="setVal('my_commitment', this.value)">${escapeHTML(comVal)}</textarea>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="field-group">
            <label>Participant Signature / Name</label>
            <input type="text" class="clean-input" placeholder="Your Name"
                   value="${escapeHTML(sigVal)}"
                   oninput="setVal('signer_name', this.value)">
          </div>
          <div class="field-group">
            <label>Date</label>
            <input type="date" class="clean-input" 
                   value="${escapeHTML(dateVal)}"
                   onchange="setVal('sign_date', this.value)">
          </div>
        </div>
      </div>

      <!-- Summary Footer Actions -->
      <div class="summary-footer-bar">
        <button class="neo-btn btn-white" onclick="goToStep(7, getMilestoneSheets(STAGES[6]).length - 1)">
          &larr; Back to Stage 7 (Sap)
        </button>
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="neo-btn btn-black" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
            &uarr; Back to Top
          </button>
          <button class="neo-btn btn-yellow" onclick="window.print()">
            Print / Save as PDF
          </button>
        </div>
      </div>
    </div>
  `;
}

/* ========================================================
   NAVIGATION & DROPDOWN CONTROLLER
   ======================================================== */
function toggleMilestones(e) {
  e.stopPropagation();
  var wrap = document.getElementById("milestonesDropdown");
  wrap.classList.toggle("open");
}

function selectMilestone(num) {
  var wrap = document.getElementById("milestonesDropdown");
  wrap.classList.remove("open");
  goToStep(num, 0);
}

// Close dropdown on outside click
document.addEventListener("click", function(e){
  var wrap = document.getElementById("milestonesDropdown");
  if (wrap && !wrap.contains(e.target)) {
    wrap.classList.remove("open");
  }
});

function goToStep(step, subPage) {
  currentStep = step;
  currentSubPage = (typeof subPage === "number") ? subPage : 0;
  var html = "";

  if (step === -3) {
    html = renderCover();
  } else if (step === -2) {
    html = renderQuote();
  } else if (step === -1) {
    html = renderIntro();
  } else if (step === 0) {
    html = renderTreeMap();
  } else if (step >= 1 && step <= 7) {
    html = renderStage(step - 1, currentSubPage);
  } else if (step === 8) {
    html = renderSummary();
  }

  mainEl.innerHTML = html;
  updateNavState();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateNavState() {
  document.querySelectorAll(".nav-link-btn").forEach(function(b){
    b.classList.remove("active");
  });
  document.querySelectorAll(".dropdown-item").forEach(function(item){
    item.classList.remove("active-item");
  });

  var labelEl = document.getElementById("milestoneTabLabel");

  if (currentStep === -3) {
    var b = document.getElementById("tabIntro");
    if (b) b.classList.add("active");
    if (labelEl) labelEl.textContent = "Milestones";
  } else if (currentStep === -2) {
    var b = document.getElementById("tabQuote");
    if (b) b.classList.add("active");
    if (labelEl) labelEl.textContent = "Milestones";
  } else if (currentStep === -1) {
    var b = document.getElementById("tabGuide");
    if (b) b.classList.add("active");
    if (labelEl) labelEl.textContent = "Milestones";
  } else if (currentStep === 0) {
    var b = document.getElementById("tabTree");
    if (b) b.classList.add("active");
    if (labelEl) labelEl.textContent = "Milestones";
  } else if (currentStep >= 1 && currentStep <= 7) {
    var b = document.getElementById("tabMilestones");
    if (b) b.classList.add("active");
    var s = STAGES[currentStep - 1];
    if (labelEl) labelEl.textContent = s.num + ". " + s.name;
    var dropdownItems = document.querySelectorAll(".dropdown-item");
    if (dropdownItems[currentStep - 1]) {
      dropdownItems[currentStep - 1].classList.add("active-item");
    }
  } else if (currentStep === 8) {
    var b = document.getElementById("tabSummary");
    if (b) b.classList.add("active");
    if (labelEl) labelEl.textContent = "Milestones";
  }
}

function updateProgress() {
  var totalStages = 7;
  var completed = 0;
  STAGES.forEach(function(st){
    var answered = false;
    if (st.id === "soil") answered = !!STORE["soil_summary"];
    else if (st.id === "seed") answered = !!STORE["seed_desc"];
    else if (st.id === "root") answered = !!STORE["root_f1"];
    else if (st.id === "stem") answered = !!STORE["stem_routines"];
    else if (st.id === "branch") answered = !!STORE["branch_1"];
    else if (st.id === "fruit") answered = !!STORE["fruit_seen"];
    else if (st.id === "sap") answered = !!STORE["sap_practices"];
    if (answered) completed++;
  });

  var pct = Math.round((completed / totalStages) * 100);
  var fillEl = document.getElementById("progressBar");
  if (fillEl) fillEl.style.width = pct + "%";
}

function escapeHTML(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// Print handling: Outputs all A4 landscape sheets
window.onbeforeprint = function() {
  var fullHTML = renderCover() + renderQuote() + renderIntro() + renderTreeMap();
  for (var i = 0; i < 7; i++) {
    var sheets = getMilestoneSheets(STAGES[i]);
    for (var j = 0; j < sheets.length; j++) {
      fullHTML += renderStage(i, j);
    }
  }
  fullHTML += renderSummary();
  mainEl.innerHTML = fullHTML;
};

window.onafterprint = function() {
  goToStep(currentStep, currentSubPage);
};

// Initial load at Intro
goToStep(-3, 0);
</script>
</body>
</html>
